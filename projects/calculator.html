<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Python Calculator | Muhammad Sadiq</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            background: #050b18;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;
        }


        .container {
            width: 100%;

            max-width: 450px;

            text-align: center;
        }


        .back {
            display: inline-block;

            margin-bottom: 25px;

            color: #60a5fa;

            text-decoration: none;

            font-weight: bold;
        }


        .back:hover {
            color: white;
        }


        h1 {
            font-size: 38px;

            margin-bottom: 10px;
        }


        .description {
            color: #a8b2c3;

            margin-bottom: 30px;
        }


        .calculator {
            background: #0d1930;

            border: 1px solid
                rgba(255,255,255,0.12);

            border-radius: 20px;

            padding: 25px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.4);
        }


        #display {
            width: 100%;

            height: 75px;

            margin-bottom: 20px;

            padding: 15px;

            border: none;

            border-radius: 12px;

            background: #050b18;

            color: white;

            font-size: 30px;

            text-align: right;

            outline: none;
        }


        .buttons {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;
        }


        .buttons button {
            height: 65px;

            border: none;

            border-radius: 12px;

            background: #172642;

            color: white;

            font-size: 20px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .buttons button:hover {
            background: #263b60;

            transform: translateY(-2px);
        }


        .operator {
            background: #2563eb !important;
        }


        .clear {
            background: #dc2626 !important;
        }


        .equals {
            background: #16a34a !important;
        }


        .zero {
            grid-column: span 2;
        }


        .footer {
            margin-top: 25px;

            color: #69758a;

            font-size: 14px;
        }

    </style>

</head>


<body>

    <div class="container">

        <a href="../index.html" class="back">
            ← Back to Portfolio
        </a>


        <h1>🧮 Python Calculator</h1>


        <p class="description">
            My first calculator project while learning
            programming and software development.
        </p>


        <div class="calculator">

            <input
                type="text"
                id="display"
                value="0"
                readonly>


            <div class="buttons">

                <button
                    class="clear"
                    onclick="clearDisplay()">
                    AC
                </button>

                <button onclick="deleteNumber()">
                    DEL
                </button>

                <button
                    class="operator"
                    onclick="addOperator('%')">
                    %
                </button>

                <button
                    class="operator"
                    onclick="addOperator('/')">
                    ÷
                </button>


                <button onclick="addNumber('7')">
                    7
                </button>

                <button onclick="addNumber('8')">
                    8
                </button>

                <button onclick="addNumber('9')">
                    9
                </button>

                <button
                    class="operator"
                    onclick="addOperator('*')">
                    ×
                </button>


                <button onclick="addNumber('4')">
                    4
                </button>

                <button onclick="addNumber('5')">
                    5
                </button>

                <button onclick="addNumber('6')">
                    6
                </button>

                <button
                    class="operator"
                    onclick="addOperator('-')">
                    −
                </button>


                <button onclick="addNumber('1')">
                    1
                </button>

                <button onclick="addNumber('2')">
                    2
                </button>

                <button onclick="addNumber('3')">
                    3
                </button>

                <button
                    class="operator"
                    onclick="addOperator('+')">
                    +
                </button>


                <button
                    class="zero"
                    onclick="addNumber('0')">
                    0
                </button>

                <button onclick="addNumber('.')">
                    .
                </button>

                <button
                    class="equals"
                    onclick="calculate()">
                    =
                </button>

            </div>

        </div>


        <p class="footer">
            Built by Muhammad Sadiq 🇳🇬
        </p>

    </div>


    <script>

        let display =
            document.getElementById("display");


        function addNumber(number) {

            if (display.value === "0") {

                display.value = number;

            } else {

                display.value += number;

            }

        }


        function addOperator(operator) {

            display.value += operator;

        }


        function clearDisplay() {

            display.value = "0";

        }


        function deleteNumber() {

            if (display.value.length <= 1) {

                display.value = "0";

            } else {

                display.value =
                    display.value.slice(0, -1);

            }

        }


        function calculate() {

            try {

                display.value =
                    Function(
                        "return " +
                        display.value
                    )();

            } catch {

                display.value = "Error";

            }

        }

    </script>

</body>

  </html>
