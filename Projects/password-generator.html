<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Muhammad Sadiq's interactive password generator built with HTML, CSS and JavaScript.">

    <title>Password Generator | Muhammad Sadiq</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top,
                    rgba(59, 130, 246, 0.18),
                    transparent 45%
                ),
                #050b18;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 20px;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 100%;

            max-width: 430px;

            text-align: center;

        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back {

            display: inline-block;

            margin-bottom: 25px;

            color: #60a5fa;

            text-decoration: none;

            font-weight: bold;

            transition: 0.3s;

        }


        .back:hover {

            color: white;

            transform: translateX(-4px);

        }


        /* =========================
           TITLE
        ========================= */

        .badge {

            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: rgba(59, 130, 246, 0.12);

            border: 1px solid rgba(96, 165, 250, 0.3);

            color: #60a5fa;

            font-size: 12px;

            font-weight: bold;

            margin-bottom: 15px;

        }


        h1 {

            font-size: 34px;

            margin-bottom: 12px;

        }


        .description {

            color: #a8b2c3;

            line-height: 1.6;

            margin-bottom: 30px;

        }


        /* =========================
           CARD
        ========================= */

        .card {

            background: rgba(13, 25, 48, 0.95);

            border: 1px solid rgba(255,255,255,0.12);

            border-radius: 24px;

            padding: 24px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.45);

            backdrop-filter: blur(15px);

            text-align: left;

        }


        /* =========================
           OUTPUT DISPLAY
        ========================= */

        .output-row {

            display: flex;

            gap: 10px;

            margin-bottom: 22px;

        }


        #output {

            flex: 1;

            height: 60px;

            padding: 0 15px;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 14px;

            background: #030817;

            color: #60a5fa;

            font-size: 18px;

            letter-spacing: 1px;

            outline: none;

        }


        #copy-btn {

            width: 60px;

            border: 1px solid rgba(255,255,255,0.05);

            border-radius: 14px;

            background: #172642;

            color: white;

            font-size: 20px;

            cursor: pointer;

            transition: background 0.15s ease, transform 0.15s ease;

        }


        #copy-btn:hover {

            background: #22385c;

        }


        #copy-btn:active {

            transform: scale(0.94);

        }


        /* =========================
           CONTROLS
        ========================= */

        .field {

            margin-bottom: 18px;

        }


        .field-label {

            display: flex;

            justify-content: space-between;

            font-size: 14px;

            color: #a8b2c3;

            margin-bottom: 8px;

        }


        #length-value {

            color: #60a5fa;

            font-weight: bold;

        }


        input[type="range"] {

            width: 100%;

            accent-color: #2563eb;

        }


        .checkbox-row {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 12px 0;

            font-size: 15px;

            color: #d7dde8;

            cursor: pointer;

        }


        .checkbox-row input {

            width: 18px;

            height: 18px;

            accent-color: #2563eb;

        }


        /* =========================
           GENERATE BUTTON
        ========================= */

        #generate-btn {

            width: 100%;

            height: 54px;

            margin-top: 10px;

            border: none;

            border-radius: 14px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: background 0.15s ease, transform 0.15s ease;

        }


        #generate-btn:hover {

            background: #3b82f6;

        }


        #generate-btn:active {

            transform: scale(0.97);

        }


        /* =========================
           STRENGTH LABEL
        ========================= */

        #strength {

            margin-top: 14px;

            text-align: center;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 0.5px;

        }


        /* =========================
           TECHNOLOGIES
        ========================= */

        .technologies {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 25px;

        }


        .technologies span {

            padding: 6px 11px;

            border-radius: 20px;

            background: rgba(59,130,246,0.1);

            border: 1px solid rgba(59,130,246,0.25);

            color: #60a5fa;

            font-size: 12px;

            font-weight: bold;

        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: 25px;

            color: #69758a;

            font-size: 14px;

        }

    </style>

</head>


<body>


    <div class="container">


        <!-- BACK -->

        <a
            href="../index.html"
            class="back">

            ← Back to Portfolio

        </a>


        <!-- TITLE -->

        <span class="badge">
            PYTHON → WEB PROJECT
        </span>


        <h1>
            Password Generator
        </h1>


        <p class="description">

            A simple tool that creates strong, random
            passwords. Originally built in Python, rebuilt
            here in HTML, CSS and JavaScript.

        </p>


        <!-- CARD -->

        <div class="card">


            <div class="output-row">

                <input
                    type="text"
                    id="output"
                    value="Click Generate"
                    readonly>


                <button
                    id="copy-btn"
                    title="Copy password">

                    ⧉

                </button>

            </div>


            <div class="field">

                <div class="field-label">

                    <span>Length</span>
                    <span id="length-value">12</span>

                </div>


                <input
                    type="range"
                    id="length"
                    min="4"
                    max="32"
                    value="12">

            </div>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="letters"
                    checked>

                Include letters (a-z, A-Z)

            </label>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="numbers"
                    checked>

                Include numbers (0-9)

            </label>


            <label class="checkbox-row">

                <input
                    type="checkbox"
                    id="symbols"
                    checked>

                Include symbols (!@#$...)

            </label>


            <button id="generate-btn">
                Generate Password
            </button>


            <p id="strength"></p>

        </div>


        <!-- TECHNOLOGIES -->

        <div class="technologies">

            <span>HTML</span>

            <span>CSS</span>

            <span>JavaScript</span>

        </div>


        <p class="footer">

            Built by Muhammad Sadiq 🇳🇬

        </p>


    </div>


    <script>


        // =========================
        // ELEMENTS
        // =========================

        const output = document.getElementById("output");
        const lengthSlider = document.getElementById("length");
        const lengthValue = document.getElementById("length-value");
        const lettersBox = document.getElementById("letters");
        const numbersBox = document.getElementById("numbers");
        const symbolsBox = document.getElementById("symbols");
        const generateBtn = document.getElementById("generate-btn");
        const copyBtn = document.getElementById("copy-btn");
        const strengthLabel = document.getElementById("strength");


        // =========================
        // UPDATE LENGTH LABEL
        // =========================

        lengthSlider.addEventListener("input", () => {

            lengthValue.textContent = lengthSlider.value;

        });


        // =========================
        // GENERATE PASSWORD
        // =========================

        function generatePassword() {

            const length = parseInt(lengthSlider.value);

            const useLetters = lettersBox.checked;
            const useNumbers = numbersBox.checked;
            const useSymbols = symbolsBox.checked;

            const letterChars =
                "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";

            const numberChars = "0123456789";

            const symbolChars = "!@#$%^&*()-_=+";


            let pool = "";

            if (useLetters) pool += letterChars;
            if (useNumbers) pool += numberChars;
            if (useSymbols) pool += symbolChars;


            if (pool === "") {

                output.value = "Pick at least one option";
                strengthLabel.textContent = "";
                return;

            }


            let password = "";

            // crypto.getRandomValues gives stronger randomness
            // than Math.random for things like passwords

            const randomValues = new Uint32Array(length);
            crypto.getRandomValues(randomValues);

            for (let i = 0; i < length; i++) {

                password += pool[randomValues[i] % pool.length];

            }


            output.value = password;

            updateStrength(length, useLetters, useNumbers, useSymbols);

        }


        // =========================
        // STRENGTH INDICATOR
        // =========================

        function updateStrength(length, letters, numbers, symbols) {

            const varietyCount =
                [letters, numbers, symbols].filter(Boolean).length;


            let score = 0;

            if (length >= 8) score++;
            if (length >= 12) score++;
            if (varietyCount >= 2) score++;
            if (varietyCount === 3) score++;


            if (score <= 1) {

                strengthLabel.textContent = "Weak";
                strengthLabel.style.color = "#ef4444";

            } else if (score <= 3) {

                strengthLabel.textContent = "Medium";
                strengthLabel.style.color = "#f59e0b";

            } else {

                strengthLabel.textContent = "Strong";
                strengthLabel.style.color = "#22c55e";

            }

        }


        // =========================
        // COPY TO CLIPBOARD
        // =========================

        copyBtn.addEventListener("click", () => {

            if (
                !output.value ||
                output.value === "Click Generate" ||
                output.value === "Pick at least one option"
            ) {

                return;

            }


            navigator.clipboard.writeText(output.value)
                .then(() => {

                    const original = copyBtn.textContent;
                    copyBtn.textContent = "✓";

                    setTimeout(() => {
                        copyBtn.textContent = original;
                    }, 1200);

                });

        });


        // =========================
        // EVENTS
        // =========================

        generateBtn.addEventListener("click", generatePassword);


        // Generate one automatically on page load

        generatePassword();


    </script>


</body>

</html>
